<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan stołów - wesele</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>Plan stołów</h1>
          <p>Wesele: lista potwierdzonych gości z Excela</p>
        </div>
      </div>

      <div class="stats" id="stats" aria-live="polite"></div>

      <div class="actions">
        <button class="button" id="exportCsv" type="button">CSV</button>
        <button class="button" id="savePlan" type="button">Zapisz plan</button>
        <button class="button" id="loadPlan" type="button">Wczytaj plan</button>
        <button class="button" id="clearRoundTables" type="button">Wyczyść okrągłe</button>
        <button class="button danger" id="resetPlan" type="button">Reset</button>
        <input id="planFileInput" type="file" accept="application/json,.json" hidden />
      </div>
    </header>

    <main class="app-shell">
      <aside class="guest-panel">
        <section class="guest-section unassigned-section">
          <div class="panel-top">
            <div>
              <h2>Nieprzydzieleni</h2>
              <span id="unassignedCount" class="muted"></span>
            </div>
            <input id="guestSearch" class="search" type="search" placeholder="Szukaj osoby" />
          </div>
          <form id="addGuestForm" class="add-guest-form">
            <input id="newGuestName" class="text-input" type="text" placeholder="Nowa osoba" />
            <button class="button" type="submit">Dodaj</button>
          </form>
          <div id="unassignedList" class="guest-list drop-target" data-target="unassigned"></div>
        </section>

        <section class="guest-section reserve-section">
          <div class="panel-top">
            <div>
              <h2>Rezerwowi</h2>
              <span id="reserveCount" class="muted"></span>
            </div>
          </div>
          <div id="reserveList" class="guest-list reserve-list"></div>
        </section>
      </aside>

      <section class="tables-panel">
        <div class="section-top">
          <div>
            <h2>Stoły</h2>
            <div id="planNotice" class="notice"></div>
          </div>
          <button class="button" id="addTable" type="button">Dodaj stół</button>
        </div>
        <div id="tablesGrid" class="tables-grid"></div>
      </section>
    </main>

    <section class="floor-plan-section">
      <div class="section-top">
        <div>
          <h2>Wizualizacja sali</h2>
          <div class="notice">Układ orientacyjny według szkicu, aktualizowany z przypisań przy stołach.</div>
        </div>
      </div>
      <div id="floorPlan" class="floor-plan" aria-label="Graficzny układ stołów"></div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
